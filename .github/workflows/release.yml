name: Release

# Publish a release on GitHub (tag e.g. v0.7.0); this builds the zip and attaches it.
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build add-on zip
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p build/ScanShare/Media
          cp ScanShare.toc ScanShare.lua Options.lua LICENSE build/ScanShare/
          cp -r Libs build/ScanShare/
          cp Media/icon.tga build/ScanShare/Media/
          (cd build && zip -r "../ScanShare-${VERSION}.zip" ScanShare)
          echo "ZIP=ScanShare-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Attach zip to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: ${{ env.ZIP }}
